[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-assistant"
version = "0.1.0"
description = "The private, offline-first voice assistant for your desktop."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Adarsh Singh", email = "adarsh2001gop@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.7.2",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0,<2.1.0",
    "faster-whisper>=1.0.3",
    "openwakeword>=0.6.0",
    "piper-tts>=1.2.0",
    "onnxruntime>=1.18.1",
    "pydantic>=2.8.2",
    "platformdirs>=4.2.2",
    "keyring>=25.2.1",
    "rapidfuzz>=3.9.6",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "tomli-w>=1.0.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.5",
    "mypy>=1.11.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.4.0",
    "pytest-mock>=3.14.0",
    "pre-commit>=3.7.1",
]

[project.urls]
Homepage = "https://github.com/Adarsh-Singh07/nova"
Repository = "https://github.com/Adarsh-Singh07/nova.git"
Issues = "https://github.com/Adarsh-Singh07/nova/issues"

[project.scripts]
nova = "nova.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "nova.core.*"
strict = true

[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "faster_whisper.*",
    "openwakeword.*",
    "piper.*",
    "keyring.*",
    "rapidfuzz.*",
    "PySide6.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/nova"]
branch = true
omit = [
    "src/nova/platform/windows.py", # platform-specific in linux CI
    "src/nova/platform/linux.py",   # platform-specific in windows CI
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
fail_under = 80
